name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: rake spec (ruby ${{ matrix.ruby }}, ${{ matrix.gemfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        gemfile: [rails_8_0, rails_8_1]
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec

  check:
    name: rake ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake ${{ matrix.task }}

  release:
    needs: [spec, check]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build and push both gems to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/0\.0\.0/${version}/" lib/openapi_kit/version.rb

          push() {
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://rubygems.org/api/v2/rubygems/$1/versions/${version}.json")
            case "${status}" in
              200) echo "$1 ${version} is already published, skipping" ;;
              404) gem build "$1.gemspec" && gem push "$1-${version}.gem" ;;
              *)   echo "rubygems.org answered ${status} for $1, refusing to guess"; exit 1 ;;
            esac
          }

          push openapi_kit
          push openapi_kit-codegen
