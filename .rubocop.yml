plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  NewCops: enable
  Exclude:
    - "spec/golden/**/*"
    - "spec/dummy/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "spec/typecheck/**/*"
    - "spec/scripts/**/*"

# Generated-code emitters are inherently long; readability of output wins.
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Max: 50
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
Layout/LineLength:
  Max: 120
Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Layout/EmptyLinesAfterModuleInclusion:
  Enabled: false
Style/DoubleNegation:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/PerceivedComplexity:
  Max: 15
Naming/PredicateMethod:
  Enabled: false
Style/RaiseArgs:
  AllowedCompactTypes:
    - Oapi::DecodeError
    - DecodeError
Naming/FileName:
  Exclude:
    - "lib/oapi-runtime.rb"
Lint/UnusedMethodArgument:
  Exclude:
    - "lib/oapi/optional.rb"
    - "spec/oapi/container_spec.rb"
    - "spec/generated/**/*"
RSpec/MultipleExpectations:
  Max: 6
RSpec/ExampleLength:
  Max: 20
RSpec/NestedGroups:
  Max: 4
RSpec/InstanceVariable:
  Exclude:
    - "spec/oapi/codegen/writer_spec.rb"
    - "spec/oapi/codegen/config_spec.rb"
    - "spec/generated/**/*"
RSpec/DescribeClass:
  Enabled: false
Metrics/ModuleLength:
  Max: 150
Naming/BlockForwarding:
  EnforcedStyle: explicit
Style/ArgumentsForwarding:
  Enabled: false
