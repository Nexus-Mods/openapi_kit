plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  NewCops: enable
  Exclude:
    - "gemfiles/**/*"
    - "spec/golden/**/*"
    - "spec/dummy/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "spec/typecheck/**/*"
    - "spec/scripts/**/*"

# Generated-code emitters are inherently long; readability of output wins.
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Max: 50
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
Layout/LineLength:
  Max: 120
Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Layout/EmptyLinesAfterModuleInclusion:
  Enabled: false
Style/DoubleNegation:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/PerceivedComplexity:
  Max: 15
Naming/PredicateMethod:
  Enabled: false
Style/RaiseArgs:
  AllowedCompactTypes:
    - OpenAPIKit::DecodeError
    - DecodeError
Naming/FileName:
  Exclude:
    - "lib/openapi_kit-codegen.rb"
Lint/UnusedMethodArgument:
  Exclude:
    - "lib/openapi_kit/optional.rb"
    - "spec/openapi_kit/container_spec.rb"
    - "spec/generated/**/*"
RSpec/MultipleExpectations:
  Max: 6
RSpec/ExampleLength:
  Max: 20
RSpec/NestedGroups:
  Max: 4
RSpec/InstanceVariable:
  Exclude:
    - "spec/openapi_kit/codegen/writer_spec.rb"
RSpec/DescribeClass:
  Enabled: false
RSpec/SpecFilePathFormat:
  CustomTransform:
    OpenAPIKit: openapi_kit
Metrics/ModuleLength:
  Max: 150
Naming/BlockForwarding:
  EnforcedStyle: explicit
Style/ArgumentsForwarding:
  Enabled: false
# type_member must be assigned to a constant in the class body; on an anonymous class
# nothing leaks out of the example.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/openapi_kit/codec/contract_spec.rb"
RSpec/LeakyConstantDeclaration:
  Exclude:
    - "spec/openapi_kit/codec/contract_spec.rb"
