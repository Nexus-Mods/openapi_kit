AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - "spec/golden/**/*"
    - "spec/dummy/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

# Generated-code emitters are inherently long; readability of output wins.
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Max: 50
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
Layout/LineLength:
  Max: 120
Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Layout/EmptyLinesAfterModuleInclusion:
  Enabled: false
Style/DoubleNegation:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/PerceivedComplexity:
  Max: 15
Naming/PredicateMethod:
  Enabled: false
