openapi: 3.0.3
info: { title: Demo, version: "1.0" }
paths:
  /games/{gameDomain}/mods:
    get:
      operationId: list_mods
      tags: [mods]
      parameters:
        - { name: gameDomain, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ModStatus" } }
        - { name: Application-Name, in: header, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Mod" } }
        "400":
          description: bad request
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    post:
      operationId: create_mod
      tags: [mods]
      parameters:
        - { name: gameDomain, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMod" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mod" }
        "204": { description: nothing to do }
        default:
          description: fallback
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /health:
    get:
      operationId: get_health
      tags: [system]
      responses:
        "200": { description: ok }
components:
  schemas:
    ModStatus: { type: string, enum: [live, hidden] }
    ProblemDetails:
      type: object
      required: [title]
      properties:
        title: { type: string }
        detail: { type: string }
    Mod:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { $ref: "#/components/schemas/ModStatus" }
    NewMod:
      type: object
      required: [name]
      properties:
        name: { type: string }
