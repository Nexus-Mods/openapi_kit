openapi: 3.0.3
info: { title: Demo, version: "1.0" }
paths: {}
components:
  schemas:
    Uuid: { type: string, format: uuid }
    ModStatus: { type: string, enum: [live, under-moderation, hidden] }
    User:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        friend: { $ref: "#/components/schemas/User" }
    Mod:
      type: object
      required: [id, name, updatedAt, deletedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { $ref: "#/components/schemas/ModStatus" }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        summary: { type: string }
        bio: { type: string, nullable: true }
        pageSize: { type: integer, default: 20 }
        owner:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/User" }]
        tags: { type: array, items: { type: string } }
        meta:
          type: object
          properties: { note: { type: string } }
        extra: { type: object, additionalProperties: { type: integer } }
    Pet:
      oneOf: [{ $ref: "#/components/schemas/Cat" }, { $ref: "#/components/schemas/Dog" }]
      discriminator:
        propertyName: kind
        mapping: { cat: "#/components/schemas/Cat", dog: "#/components/schemas/Dog" }
    Cat: { type: object, required: [kind], properties: { kind: { type: string }, lives: { type: integer } } }
    Dog: { type: object, required: [kind], properties: { kind: { type: string }, breed: { type: string } } }
    Loose: { anyOf: [{ type: string }, { type: integer }] }
    Adversarial:
      type: object
      required: [serialize]
      properties:
        serialize: { type: string }
        since: { type: string, format: date-time, default: "2020-01-01T00:00:00Z" }
        cleared: { type: string, nullable: true, default: null }
        rate: { type: number, default: 1 }
      additionalProperties: { type: string, format: date-time }
    snake_cat: { type: object, required: [kind], properties: { kind: { type: string } } }
    snake_dog: { type: object, required: [kind], properties: { kind: { type: string } } }
    SnakePet:
      oneOf: [{ $ref: "#/components/schemas/snake_cat" }, { $ref: "#/components/schemas/snake_dog" }]
      discriminator: { propertyName: kind }
